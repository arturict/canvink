name: Bug report
description: Report a reproducible problem in Canvink.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Canvink. Remove personal notes and documents from screenshots or sample files.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing report.
          required: true
        - label: I removed private or copyrighted content from the report.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - Windows desktop
        - Linux desktop
        - Web demo
        - Landing page
        - Build or installation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA.
      placeholder: v0.1.0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a new empty notebook when possible.
      placeholder: |
        1. Create a page
        2. Add an image
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Add logs or screenshots only after removing personal data.
      render: shell
