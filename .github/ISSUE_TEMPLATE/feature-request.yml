name: Feature request
description: Propose a focused improvement to Canvink.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What notebook task is difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: principles
    attributes:
      label: Product principles
      options:
        - label: The proposal can work without a required account or cloud service.
        - label: The proposal preserves a documented export path.
