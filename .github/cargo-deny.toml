[advisories]
yanked = "deny"
unmaintained = "workspace"
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2024-0429", reason = "Tauri 2.11 requires the GTK3 Linux stack and glib 0.18. Canvink does not call the affected VariantStrIter API. Remove this exception when Tauri uses glib 0.20 or newer." },
]

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.9
allow = [
  "0BSD",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
  "sparse+https://index.crates.io/",
]
