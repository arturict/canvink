name: canvink

services:
  web:
    image: ${CANVINK_IMAGE:-canvink:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CANVINK_COMMIT: ${CANVINK_COMMIT:-self-hosted}
    ports:
      - "127.0.0.1:${CANVINK_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    stop_grace_period: 10s
