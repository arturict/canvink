# Marks this directory as its own pnpm workspace root, independent of any
# workspace file further up the tree (this service is a standalone package
# with its own lockfile).
allowBuilds:
  esbuild: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260901.1'
onlyBuiltDependencies:
  - esbuild
  - workerd
overrides:
  # Miniflare pins these exact versions; keep its API while applying security patches.
  'miniflare>sharp': 0.35.4
  'miniflare>undici': 7.29.1
