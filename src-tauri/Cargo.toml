[package]
name = "canvink"
version = "0.1.0"
description = "Local-first canvas notebook"
authors = ["Canvink contributors"]
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/arturict/canvink"

[package.metadata.ci]
# Increment this value to rotate the full Rust cache key while retaining the
# toolchain-level restore prefix.
rust-cache-policy = "lean-v1"

[lib]
name = "canvink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = "=2.4.3"
thiserror = "2.0"
